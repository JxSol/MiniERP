name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Зависимости строго по uv.lock
        run: uv sync --frozen --group dev
      - name: Линтер
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Миграции актуальны
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Тесты
        run: uv run pytest -q
