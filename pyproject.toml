[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# Длинные строки — это русские подсказки; код переносит форматтер
ignore = ["E501", "DJ012"]  # DJ012: методы сгруппированы по смыслу

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
