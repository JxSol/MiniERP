[project]
name = "mini-erp"
version = "0.6.0"
description = "Мини-ERP для производства 3D-печатных и лазерных изделий: каталог, себестоимость, склад"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Версии закреплены точно: обновление — осознанный шаг (uv lock --upgrade-package <имя>),
# особенно django-unfold, часть шаблонов которого переопределена в templates/unfold/.
dependencies = [
    "django==5.2.18",
    "django-environ==0.14.0",
    "django-import-export==4.4.1",
    "django-simple-history==3.13.0",
    "django-unfold==0.110.0",
    "pillow==12.3.0",
    "pillow-heif==1.8.1",
    "psycopg[binary]==3.3.6",
    "waitress==3.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.0",
]

[tool.uv]
# Проект не собирается в пакет: только окружение для manage.py
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# Длинные строки — это русские подсказки; код переносит форматтер
ignore = ["E501", "DJ012"]  # DJ012: методы сгруппированы по смыслу

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
